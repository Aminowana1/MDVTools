# MDVTools 1.0.6
# Plugin de herramientas de profesión para MDVCRAFT.
#
# El plugin lee líneas del lore del item:
# '&3 &7■ &fTala Multiple: 1'
# '&3 &7■ &fRotura Multiple: 2'
# '&3 &7■ &fMulti Cosecha: 2'
# '&3 &7■ &fAuto Replantar'
#
# Los números significan bloques/cultivos EXTRA.
# Ejemplo: Rotura Multiple: 2 = rompe el bloque normal + 2 bloques extra.

debug: false

# Parche anti-bloques fantasma para herramientas muy rápidas.
# No rompe ni dropea nada: solo reenvía al cliente el estado real del bloque
# 1 y 3 ticks después de minar, para corregir piedras fantasma irrompibles.
anti-ghost:
  enabled: true
  update-neighbors: true
  update-nearby-players: true
  player-radius: 8
  delays:
    - 1
    - 3
  # Si está en false, funciona con cualquier pico vanilla/MMOItems rápido.
  # Si está en true, solo funciona si la herramienta tiene lore MDVTools.
  only-tools-with-mdv-lore: false
  allowed-blocks:
    - STONE
    - DEEPSLATE
    - COBBLESTONE
    - COBBLED_DEEPSLATE
    - GRANITE
    - DIORITE
    - ANDESITE
    - TUFF
    - CALCITE
    - DRIPSTONE_BLOCK
    - COAL_ORE
    - DEEPSLATE_COAL_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - COPPER_ORE
    - DEEPSLATE_COPPER_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - REDSTONE_ORE
    - DEEPSLATE_REDSTONE_ORE
    - LAPIS_ORE
    - DEEPSLATE_LAPIS_ORE
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - EMERALD_ORE
    - DEEPSLATE_EMERALD_ORE


messages:
  prefix: "&6&l[&5&lMDVCRAFT&6&l]  &4»  &r"
  reloaded: "&aMDVTools recargado."
  no-permission: "&cNo tienes permiso para hacer eso."

lore:
  # Se detectan también variantes con tilde:
  # Multiple / Múltiple
  tala-multiple: "Tala Multiple"
  rotura-multiple: "Rotura Multiple"
  multi-cosecha: "Multi Cosecha"
  auto-replantar: "Auto Replantar"

durability:
  enabled: true
  cost-per-extra-block: 1
  cost-per-extra-crop: 1
  respect-unbreaking: true

mining:
  enabled: true
  max-extra-blocks: 12
  # LINE = rompe hacia donde mira el jugador, parecido a Bouncing Crack.
  mode: LINE
  allowed-blocks:
    - STONE
    - DEEPSLATE
    - COBBLESTONE
    - COBBLED_DEEPSLATE
    - GRANITE
    - DIORITE
    - ANDESITE
    - TUFF
    - CALCITE
    - DRIPSTONE_BLOCK
    - COAL_ORE
    - DEEPSLATE_COAL_ORE
    - IRON_ORE
    - DEEPSLATE_IRON_ORE
    - COPPER_ORE
    - DEEPSLATE_COPPER_ORE
    - GOLD_ORE
    - DEEPSLATE_GOLD_ORE
    - REDSTONE_ORE
    - DEEPSLATE_REDSTONE_ORE
    - LAPIS_ORE
    - DEEPSLATE_LAPIS_ORE
    - DIAMOND_ORE
    - DEEPSLATE_DIAMOND_ORE
    - EMERALD_ORE
    - DEEPSLATE_EMERALD_ORE

woodcutting:
  enabled: true
  max-extra-blocks: 24
  # CONNECTED = busca troncos conectados en 6 direcciones.
  mode: CONNECTED
  allowed-blocks:
    - OAK_LOG
    - SPRUCE_LOG
    - BIRCH_LOG
    - JUNGLE_LOG
    - ACACIA_LOG
    - DARK_OAK_LOG
    - MANGROVE_LOG
    - CHERRY_LOG
    - PALE_OAK_LOG
    - STRIPPED_OAK_LOG
    - STRIPPED_SPRUCE_LOG
    - STRIPPED_BIRCH_LOG
    - STRIPPED_JUNGLE_LOG
    - STRIPPED_ACACIA_LOG
    - STRIPPED_DARK_OAK_LOG
    - STRIPPED_MANGROVE_LOG
    - STRIPPED_CHERRY_LOG
    - STRIPPED_PALE_OAK_LOG

farming:
  enabled: true
  max-extra-crops: 24
  auto-replant-needs-seed-from-drops: true
  # Si true, el bloque original también se cosecha manualmente para poder replantarlo.
  handle-original-crop: true
  allowed-crops:
    - WHEAT
    - CARROTS
    - POTATOES
    - BEETROOTS
    - NETHER_WART

# Bonus leídos desde el lore de armaduras/items equipados.
# Estos bonus están pensados para armaduras de profesión como la Armadura de Obrero.
# Formato de lore recomendado:
# '&8Agricultura Drops raros: &a+2%'
# '&8Minerales Raros: &a+2%'
# '&8Nodos de arbol extra: &a+2%'
#
# Agricultura Drops raros = bonus RELATIVO sobre custom-drops.yml.
# Ejemplo: chance base 0.25%, bonus +8% => 0.25 * 1.08 = 0.27%.
# Minerales Raros / Nodos de arbol extra = chance ABSOLUTA de dropear +1 item extra
# al romper vetas/nodos custom de MDVHeadOres.
equipment-bonuses:
  enabled: true
  max-total-bonus-percent: 100.0

  lore:
    agriculture-rare-drops: "Agricultura Drops raros"
    rare-minerals: "Minerales Raros"
    tree-node-extra: "Nodos de arbol extra"

  agriculture-rare-drops:
    enabled: true

  rare-minerals:
    enabled: true
    extra-amount: 1

  tree-node-extra:
    enabled: true
    extra-amount: 1

  mdvheadores:
    plugin-name: "MDVHeadOres"



# Bloqueo corto al cambiar a un arma MMOItems.
# Objetivo: evitar que un jugador cambie de arma y use una habilidad activa inmediatamente.
# Es event-driven: no revisa jugadores cada tick. Solo actúa cuando cambian slot/mano o intentan usar el arma.
weapon-swap-lock:
  enabled: true

  # 40 ticks = 2 segundos.
  duration-ticks: 40

  # true = aplica el bloqueo cuando el nuevo item en mano principal es un arma.
  # No afecta consumibles, pociones, comida, materiales ni items normales al usarlos.
  only-when-new-item-is-weapon: true

  # Tipos de MMOItems considerados armas para este bloqueo.
  # Usa aquí los IDs de TYPE de MMOItems, no los IDs de items individuales.
  mmoitems-types:
    - SWORD
    - DAGGER
    - AXE
    - HAMMER
    - MACE
    - BOW
    - CROSSBOW
    - STAFF
    - WAND
    - CATALYST
    - SPEAR
    - GREATSWORD
    - GREATSTAFF
    - LUTE

  # Fallback opcional si algún item no puede leerse como MMOItems.
  # Por defecto está apagado para no bloquear herramientas vanilla por accidente.
  fallback-vanilla-materials:
    enabled: false
    materials:
      - WOODEN_SWORD
      - STONE_SWORD
      - IRON_SWORD
      - GOLDEN_SWORD
      - DIAMOND_SWORD
      - NETHERITE_SWORD
      - WOODEN_AXE
      - STONE_AXE
      - IRON_AXE
      - GOLDEN_AXE
      - DIAMOND_AXE
      - NETHERITE_AXE
      - BOW
      - CROSSBOW
      - MACE

  block:
    # Bloquea click izquierdo, shift+izquierdo, click derecho y shift+derecho con el arma.
    interact-clicks: true
    # Bloquea golpe melee durante el lock.
    melee-hit: true
    # Bloquea disparo vanilla de arco/ballesta durante el lock.
    bow-shoot: true

    # Bloquea habilidades de MMOItems durante el lock.
    # Esto es lo importante para evitar cambiar de arma y castear una habilidad al instante.
    mmoitems-abilities: true

    # Bloquea skills centralizadas por MythicLib durante el lock.
    # Se registra por reflexión: si MythicLib no está cargado, no rompe el plugin.
    mythiclib-skills: true

  messages:
    blocked: "&cAún no afirmas bien el arma en tus manos."
    # Evita spam si el jugador clickea varias veces durante los 2 segundos.
    cooldown-ms: 800

  ready-feedback:
    enabled: true
    sound:
      value: "block.note_block.hat"
      volume: 0.3
      pitch: 1.6
    particles:
      enabled: true
      particle: "CRIT"
      amount: 5

# Pasiva para ballestas: recarga automática al impactar.
# Lee líneas del lore del item. Recomendado:
# '&6&lPasiva: &eRecarga Automática al Impacto'
#
# Funcionamiento:
# 1) El jugador dispara una ballesta con el lore configurado.
# 2) Si el proyectil golpea una entidad, MDVTools recarga la ballesta.
# 3) Consume 1 flecha al recargar, para evitar munición infinita.
crossbow-auto-reload:
  enabled: true

  lore-lines:
    - "Recarga Automatica al Impacto"
    - "Recarga Automática al Impacto"

  # true = solo recarga si la flecha/virote golpea una entidad.
  # false = también recarga si golpea bloques.
  only-on-entity-hit: true

  # Consume 1 flecha al recargar automáticamente.
  consume-arrow: true
  ammo-material: ARROW

  # Pequeño cooldown interno anti-abuso, en milisegundos.
  cooldown-ms: 150

  # Tiempo máximo para recordar un proyectil marcado antes de limpiarlo.
  projectile-ttl-ticks: 400

  require-player-online: true

  sound:
    enabled: true
    value: "item.crossbow.loading_end"
    volume: 0.8
    pitch: 1.3

  particles:
    enabled: true
    particle: "CRIT"
    amount: 8
