# ==========================================================
# MDVTools 1.0.27 - Nuevos drops de pesca para MMOCore
# ==========================================================
# Estas líneas van dentro de:
# on-fish:
#   <tabla>:
#     items:
#
# No van dentro del config.yml de MDVTools.

# ----------------------------------------------------------
# 1) LIBRO ENCANTADO VANILLA REAL
# ----------------------------------------------------------
# Formato:
# enchantedbook{enchant=<minecraft enchant>;level=<nivel>;tugs=<rango>;experience=<rango>} chance amount weight
#
# El objeto generado es Material.ENCHANTED_BOOK + StoredEnchant vanilla.
# No es MMOItem y no recibe NBT/PDC de MMOItems/MDVTools.

- 'enchantedbook{enchant=protection;level=4;tugs=16-20;experience=5-7} 1 1 4'
- 'enchantedbook{enchant=fortune;level=3;tugs=16-20;experience=5-7} 1 1 4'
- 'enchantedbook{enchant=sharpness;level=5;tugs=18-22;experience=6-8} 1 1 1'
- 'enchantedbook{enchant=efficiency;level=5;tugs=18-22;experience=6-8} 1 1 1'
- 'enchantedbook{enchant=unbreaking;level=3;tugs=16-20;experience=5-7} 1 1 3'
- 'enchantedbook{enchant=mending;level=1;tugs=18-22;experience=6-8} 1 1 4'
- 'enchantedbook{enchant=feather_falling;level=4;tugs=16-20;experience=5-7} 1 1 2'
- 'enchantedbook{enchant=power;level=5;tugs=18-22;experience=6-8} 1 1 1'

# También acepta aliases en español:
# proteccion, fortuna, filo, eficiencia, irrompibilidad,
# reparacion, caida_de_pluma, poder

# ----------------------------------------------------------
# 2) MOB VANILLA COMO RESULTADO DE PESCA
# ----------------------------------------------------------
# El mob aparece EN LA UBICACIÓN ACTUAL DEL PESCADOR al completar los tugs.
# La cantidad normal de MMOCore se interpreta como cantidad de mobs.
# No se entrega ningún ítem marcador al jugador.

- 'fishmob{type=DROWNED;tugs=12-16;experience=4-6} 1 1 20'

# Ejemplo: entre 1 y 2 ahogados:
- 'fishmob{type=DROWNED;tugs=16-20;experience=5-7} 1 1-2 10'

# ----------------------------------------------------------
# 3) MYTHICMOB OPCIONAL
# ----------------------------------------------------------
# Si MythicMobs está instalado, también podés usar un ID MythicMobs.
# level es opcional y por defecto vale 1.

- 'fishmob{mythic=TU_MOB_MYTHIC;level=1;tugs=20-26;experience=8-12} 1 1 5'
