name: MDVTools
version: 1.0.29
main: com.mdvcraft.tools.MDVToolsPlugin
api-version: '1.21'
author: MDVCRAFT
description: Herramientas de profesión para MDVCRAFT.
softdepend: [MDVHeadOres, MMOItems, MythicMobs, MythicLib, MMOCore, PlaceholderAPI, Essentials]
commands:
